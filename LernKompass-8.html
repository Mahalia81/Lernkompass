<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LernKompass</title>
<style>
/* Layout: weiße Kopfzeile mit dunkelblauem Streifen und Schullogo wie in den GMSCC-Folien, darunter Kacheln, Lernzyklus und Fragekarten */
:root {
  --bg: #f3f8fd;
  --surface: #ffffff;
  --ink: #0A3254;
  --muted: #46607c;
  --line: #cfe2f3;
  --bar: #0A3254;
  --navy: #0A3254;
  --blue: #0E497C;
  --blue-soft: #e4f2fd;
  --teal: #3C70AB;
  --teal-soft: #e2ebf6;
  --accent: #2B92D5;
  --star: #c98a00;
  --star-soft: #fff4d6;
  --focus: #2B92D5;
  --mark: #BEE0FA;
  --font-display: Helvetica, Arial, sans-serif;
  --font-body: Helvetica, Arial, sans-serif;
  --radius: 10px;
  --c-start: #1F7A4A; --c-start-soft: #E2F3E8;
  --c-refl: #B4530A; --c-refl-soft: #FDEBD7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #061a2e; --surface: #0b2742; --ink: #e8f2fc; --muted: #a8c0d9; --line: #1d4266;
    --navy: #0A3254; --blue: #8cc6f2; --blue-soft: #123a5f; --teal: #a7c4e8; --teal-soft: #173d63; --accent: #2B92D5;
    --star: #f2b632; --star-soft: #3a3016; --focus: #8cc6f2; --mark: #1f4f7c;
    --c-start: #6FD39B; --c-start-soft: #16382A; --c-refl: #F6A65A; --c-refl-soft: #3F2812;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #061a2e; --surface: #0b2742; --ink: #e8f2fc; --muted: #a8c0d9; --line: #1d4266;
  --navy: #0A3254; --blue: #8cc6f2; --blue-soft: #123a5f; --teal: #a7c4e8; --teal-soft: #173d63; --accent: #2B92D5;
  --star: #f2b632; --star-soft: #3a3016; --focus: #8cc6f2; --mark: #1f4f7c;
    --c-start: #6FD39B; --c-start-soft: #16382A; --c-refl: #F6A65A; --c-refl-soft: #3F2812;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.5; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Kopfzeile */
.top { background: var(--surface); color: var(--ink); border-top: 10px solid var(--bar); border-bottom: 1px solid var(--line); }
.top .wrap { display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: "brand tabs search"; align-items: center; gap: 12px 24px; padding-block: 12px; }
.brand { grid-area: brand; display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 4px; margin-left: -4px; cursor: pointer; text-align: left; color: var(--ink); border-radius: 8px; }
.brand svg { width: 40px; height: 40px; flex: none; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; line-height: 1.1; display: block; }
.brand-claim { font-size: 0.85rem; color: var(--muted); display: block; }
nav.tabs { grid-area: tabs; display: flex; gap: 4px; justify-self: center; }
.tab { background: transparent; border: 0; color: var(--muted); padding: 10px 14px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.95rem; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.tab:hover { color: var(--ink); background: var(--blue-soft); }
.tab[aria-current="page"] { color: var(--ink); background: var(--blue-soft); box-shadow: inset 0 -3px 0 var(--accent); }
.count { font-variant-numeric: tabular-nums; font-size: 0.8rem; min-width: 1.6em; padding: 1px 7px; border-radius: 99px; background: var(--line); color: var(--ink); text-align: center; }
.search { grid-area: search; position: relative; width: 260px; }
.search input { width: 100%; padding: 10px 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.search input::placeholder { color: var(--muted); }
.search input:focus { border-color: var(--accent); }
.search .ico { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search .clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); background: none; border: 0; color: var(--muted); width: 32px; height: 32px; border-radius: 6px; cursor: pointer; font-size: 1.2rem; line-height: 1; }
.search .clear:hover { color: var(--ink); }
@media (max-width: 1060px) {
  .top .wrap { grid-template-columns: 1fr; grid-template-areas: "brand" "tabs" "search"; }
  nav.tabs { justify-self: stretch; }
  .tab { flex: 1; justify-content: center; padding: 10px 6px; }
  .search { width: 100%; }
}
@media (max-width: 420px) { .tab { font-size: 0.88rem; gap: 5px; } .brand-claim { font-size: 0.8rem; } }

main { padding-block: 32px 64px; }
main:focus { outline: none; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; color: var(--ink); text-wrap: balance; margin: 0; }
h2.view-title { font-size: clamp(1.5rem, 3.5vw, 2rem); line-height: 1.2; }
h2.view-title:focus { outline: none; }
.eyebrow { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; color: var(--teal); }
.lead { color: var(--muted); max-width: 62ch; margin: 6px 0 0; }
.head { display: grid; gap: 4px; margin-bottom: 24px; }

/* Startseite */
.hero-line { margin-bottom: 24px; }
.hero-line h2 { font-size: clamp(1.6rem, 4vw, 2.3rem); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
@media (max-width: 700px) { .tiles { grid-template-columns: 1fr; } }
.tile { display: grid; gap: 14px; align-content: start; text-align: left; padding: 28px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; transition: border-color .15s, transform .15s; position: relative; }
.tile:hover { border-color: var(--blue); transform: translateY(-2px); }
.tile .phase { display: flex; align-items: center; gap: 10px; }
.tile .dot { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.tile.start .dot { background: var(--c-start-soft); color: var(--c-start); }
.tile.reflexion .dot { background: var(--c-refl-soft); color: var(--c-refl); }
.tile .dot svg { width: 24px; height: 24px; }
.tile h3 { font-size: clamp(1.3rem, 2.6vw, 1.6rem); line-height: 1.2; }
.tile p { margin: 0; color: var(--muted); }
.tile .meta { font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tile .go { font-weight: 700; color: var(--c-start); }
.tile.start { border-top: 6px solid var(--c-start); }
.tile.reflexion { border-top: 6px solid var(--c-refl); }
.tile.reflexion .go { color: var(--c-refl); }
.favbar { margin-top: 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 18px 24px; border-radius: 14px; border: 1px dashed var(--line); background: transparent; width: 100%; cursor: pointer; text-align: left; }
.favbar:hover { border-color: var(--star); }
.favbar strong { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }
.favbar strong svg { width: 22px; height: 22px; color: var(--star); }
.favbar span { color: var(--muted); }

/* Kategorien */
.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.cat { display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 18px 20px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); cursor: pointer; min-height: 100%; }
.cat:hover { border-color: var(--blue); }
.cat h3 { font-size: 1.1rem; line-height: 1.3; }
.cat p { margin: 0; color: var(--muted); font-size: 0.93rem; }
.cat .meta { margin-top: auto; padding-top: 8px; display: flex; gap: 14px; font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.cat .meta .f { color: var(--star); font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
.cat .meta svg { width: 14px; height: 14px; }

.back { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 6px 2px; color: var(--blue); font-weight: 700; cursor: pointer; margin-bottom: 8px; border-radius: 6px; }
.back:hover { text-decoration: underline; }
.chips-scroll { overflow-x: auto; margin-bottom: 22px; padding-bottom: 4px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips-scroll .chips { flex-wrap: nowrap; }
.chip { flex: none; padding: 8px 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 0.92rem; white-space: nowrap; }
.chip:hover { border-color: var(--blue); }
.chip[aria-pressed="true"], .chip[aria-current="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }
:root[data-theme="dark"] .chip[aria-pressed="true"], :root[data-theme="dark"] .chip[aria-current="true"] { background: var(--blue); color: #061a2e; border-color: var(--blue); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip[aria-pressed="true"], :root:not([data-theme="light"]) .chip[aria-current="true"] { background: var(--blue); color: #061a2e; border-color: var(--blue); } }

/* Fragekarten */
.qs { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
@media (max-width: 400px) { .qs { grid-template-columns: 1fr; } }
.q { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 18px 20px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); min-width: 0; transition: border-color .15s, background .15s; }
.q.is-fav { border-color: var(--star); }
.q.a-start { border-left: 6px solid var(--c-start); }
.q.a-reflexion { border-left: 6px solid var(--c-refl); }
.q-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding-right: 48px; font-size: 0.82rem; color: var(--muted); }
.pill { font-weight: 700; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; padding: 2px 8px; border-radius: 99px; }
.pill.start { background: var(--c-start-soft); color: var(--c-start); }
.pill.reflexion { background: var(--c-refl-soft); color: var(--c-refl); }
.q-text { margin: 0; font-size: 1.12rem; line-height: 1.45; font-weight: 700; overflow-wrap: anywhere; user-select: text; }
.q-text mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
.star { position: absolute; top: 10px; right: 10px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--muted); }
.star:hover { background: var(--star-soft); color: var(--star); }
.star svg { width: 26px; height: 26px; }
.star[aria-pressed="true"] { color: var(--star); }
.star[aria-pressed="true"] svg path { fill: currentColor; }

.toolbar { display: flex; flex-wrap: wrap; align-items: end; gap: 14px 20px; margin-bottom: 20px; }
.field { display: grid; gap: 6px; }
.field label, .field .lbl { font-size: 0.8rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
select { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); min-width: 240px; max-width: 100%; }
.result-info { color: var(--muted); font-size: 0.95rem; margin: 0 0 14px; font-variant-numeric: tabular-nums; }

.empty { padding: 36px 24px; border-radius: 14px; border: 1px dashed var(--line); text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty svg { width: 36px; height: 36px; color: var(--star); }
.empty h3 { color: var(--ink); font-size: 1.15rem; }
.empty p { margin: 0; max-width: 46ch; }
.btn { padding: 10px 18px; border-radius: 8px; border: 0; background: var(--navy); color: #fff; font-weight: 700; cursor: pointer; }
:root[data-theme="dark"] .btn { background: var(--blue); color: #061a2e; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { background: var(--blue); color: #061a2e; } }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--navy); color: #fff; padding: 12px 16px; border-radius: 10px; display: flex; align-items: center; gap: 14px; box-shadow: 0 8px 28px rgba(9,17,32,0.3); max-width: calc(100% - 32px); z-index: 10; font-size: 0.95rem; }
:root[data-theme="dark"] .toast { background: #e8f2fc; color: #061a2e; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .toast { background: #e8f2fc; color: #061a2e; } }
.toast button { background: none; border: 1px solid currentColor; color: inherit; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-weight: 700; flex: none; }

/* Eigene Fragen */
.pill.own { background: var(--star-soft); color: var(--ink); }
.own-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding: 22px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); margin-bottom: 28px; }
.own-form.editing { border-color: var(--blue); }
.own-form .full { grid-column: 1 / -1; }
.own-form select { min-width: 0; width: 100%; }
.own-form h3 { font-size: 1.15rem; grid-column: 1 / -1; }
textarea { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 1.05rem; resize: vertical; min-height: 84px; }
.hint { margin: 0; font-size: 0.85rem; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.err { margin: 0; color: #b42318; font-weight: 700; font-size: 0.92rem; }
:root[data-theme="dark"] .err { color: #ff9b8f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .err { color: #ff9b8f; } }
.form-actions { grid-column: 1 / -1; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn-ghost { padding: 10px 18px; border-radius: 8px; border: 1px solid var(--line); background: transparent; font-weight: 700; cursor: pointer; }
.btn-ghost:hover { border-color: var(--blue); }
@media (max-width: 600px) { .own-form { grid-template-columns: 1fr; padding: 18px; } }
.q-actions { margin-top: auto; padding-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; }
.act { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 0.9rem; font-weight: 700; color: var(--blue); }
.act:hover { border-color: var(--blue); background: var(--blue-soft); }
.act.danger { color: #b42318; }
.act.danger:hover { border-color: #b42318; background: transparent; }
:root[data-theme="dark"] .act.danger { color: #ff9b8f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .act.danger { color: #ff9b8f; } }
.q.is-editing { border-color: var(--blue); border-style: dashed; }
.bars { margin-top: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.bars .favbar { margin-top: 0; }
@media (max-width: 700px) { .bars { grid-template-columns: 1fr; } }
.favbar.ownbar strong svg { color: var(--teal); }
@media (max-width: 560px) { nav.tabs { display: grid; grid-template-columns: 1fr 1fr; } }

.pill.impuls { background: var(--mark); color: var(--ink); }
.cycle { margin-top: 36px; padding: 24px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 18px; }
.cycle .head { margin-bottom: 0; }
.cycle .lead { max-width: none; }
.cycle h3 { font-size: clamp(1.3rem, 3vw, 1.7rem); }
.cycle figure { margin: 0; background: #ffffff; border-radius: 10px; overflow: hidden; }
.cycle img { display: block; width: 100%; height: auto; }
.cycle-links { display: flex; gap: 10px; flex-wrap: wrap; }
@media (max-width: 600px) { .cycle { padding: 16px; } .cycle-links .btn-ghost { flex: 1 1 100%; } }

footer { color: var(--muted); font-size: 0.85rem; padding-block: 8px 32px; border-top: 1px solid var(--line); display: grid; gap: 4px; }
footer p { margin: 0; }
footer p:first-child { color: var(--ink); font-weight: 700; padding-top: 16px; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <button class="brand" type="button" data-action="home" aria-label="LernKompass, zur Startseite">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="#2B92D5" stroke-width="2.5"/><path d="M20 6 L24 20 L20 34 L16 20 Z" fill="currentColor"/><path d="M20 20 L24 20 L20 34 L16 20 Z" fill="#2B92D5"/><circle cx="20" cy="20" r="2" fill="#ffffff"/></svg>
      <span><span class="brand-name">LernKompass</span><span class="brand-claim">Gute Fragen. Bewusst lernen.</span></span>
    </button>
    <nav class="tabs" aria-label="Hauptnavigation">
      <button class="tab" type="button" data-action="area" data-area="start">Planung</button>
      <button class="tab" type="button" data-action="area" data-area="reflexion">Reflexion</button>
      <button class="tab" type="button" data-action="own">Eigene Fragen <span class="count" id="ownCount" aria-label="eigene Fragen">0</span></button>
      <button class="tab" type="button" data-action="fav">Meine Favoriten <span class="count" id="favCount" aria-label="gespeicherte Favoriten">0</span></button>
    </nav>
    <div class="search" role="search">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <label for="q" class="sr">Fragen durchsuchen</label>
      <input id="q" type="search" placeholder="Fragen durchsuchen" autocomplete="off">
      <button class="clear" type="button" id="qClear" aria-label="Suche leeren" hidden>×</button>
    </div>
  </div>
</header>

<main id="app" class="wrap" tabindex="-1"></main>

<footer class="wrap"><p>LernKompass wurde von Kristin Schwarz mithilfe von Claude AI erstellt.</p><p>Favoriten und eigene Fragen werden nur in diesem Browser gespeichert. Es werden keine Daten übertragen.</p></footer>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  "use strict";

  };

  // IDs bleiben stabil: neue Fragen nur am Ende einer Kategorie ergänzen.
  const CATS = [
    { id: "A1", area: "start", name: "Fachliches Lernen", desc: "Fachliches Lernziel und angestrebter Wissens- oder Kompetenzzuwachs", q: [

    { id: "A2", area: "start", name: "Aufgaben verstehen und bearbeiten", desc: "Verständnis der Aufgabenstellung und Planung der Bearbeitung", q: [

    { id: "A3", area: "start", name: "Methoden und Lernstrategien", desc: "Lernstrategien auswählen und neue ausprobieren", q: [

      "Welche Strategie hat dir bei einer ähnlichen Aufgabe schon geholfen?",
      "Wie willst du vorgehen, um das Thema zu verstehen?",

      "Wie kannst du prüfen, ob du etwas wirklich verstanden hast?",
      "Was willst du diesmal anders machen als beim letzten Mal?",
      "Wie willst du dir das Wichtigste merken?",
      "Was machst du, wenn deine Strategie nicht funktioniert?"
    ]},
    { id: "A4", area: "start", name: "Selbstorganisation und Zeitplanung", desc: "Eigenständige Planung und Steuerung der Lernzeit", q: [
      "Was willst du in dieser Lernzeit schaffen?",
      "Wie teilst du dir deine Zeit ein?",
      "Womit fängst du an?",
      "Was ist heute am wichtigsten?",
      "Was machst du, wenn du früher fertig bist?",
      "Wann machst du eine kurze Pause?",
      "Welchen Trick probierst du aus, um bei der Sache zu bleiben?",

  const PEN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M13.5 6.5l4 4" stroke="currentColor" stroke-width="2"/></svg>';
  const STAR ='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>';

  function card(q, opts) {
    opts = opts || {};
    const c = CAT_BY_ID[q.cat];
    const fav = favs.has(q.id);
    const meta = (opts.showArea ? '<span class="pill ' + q.area + '">' + AREAS[q.area].label + '</span>' : "") +

      '</article>';

  /* ---------- Ansichten ---------- */
  function viewHome() {
    function tile(area) {
      const a = AREAS[area], cs = catsOf(area);
      const n = cs.reduce(function (s, c) { return s + qsOfCat(c.id).length; }, 0);
      return '<button type="button" class="tile ' + area + '" data-action="area" data-area="' + area + '">' +
        '<span class="phase"><span class="dot">' + (area === "start" ? ICON_START : ICON_REFL) + '</span><span class="eyebrow">' + (area === "start" ? "Phase 2 · Planung" : "Phase 4 · Reflexion") + '</span></span>' +
        '<h3>' + a.title + '</h3><p>' + a.sub + '</p>' +
        '<span class="meta">' + cs.length + ' Kategorien · ' + n + ' Fragen</span>' +
        '<span class="go">Fragen ansehen →</span></button>';
    }
    const fc = favs.size;
    return '<div class="hero-line head"><h2 class="view-title" tabindex="-1">Die richtige Frage zur richtigen Zeit.</h2>' +
      '<p class="lead">Wähle den Zeitpunkt der Lernphase. Danach findest du passende Fragen für deine Schülerinnen und Schüler.</p></div>' +
      '<div class="tiles">' + tile("start") + tile("reflexion") + '</div>' +
      '<div class="bars"><button type="button" class="favbar" data-action="fav"><strong>' + STAR.replace('fill="none"', 'fill="currentColor"') + 'Meine Favoriten</strong><span>' +

      '<button type="button" class="favbar ownbar" data-action="own"><strong>' + PEN + 'Meine eigenen Fragen</strong><span>' +
      (own.length ? own.length + (own.length === 1 ? " eigene Frage" : " eigene Fragen") : "Eigene Frage hinzufügen") + '</span></button></div>' +
      '<section class="cycle" aria-labelledby="cycleTitle"><div class="head"><span class="eyebrow">Unser Lernzyklus</span><h3 id="cycleTitle">Die Umsetzung am Campus Cordis</h3>' +
      '<p class="lead">Die Fragen gehören zu Phase 2 (Planung, 3&nbsp;min) und Phase 4 (Reflexion, 3&nbsp;min).</p></div>' +
      '<figure><img src="' + ZYKLUS + '" alt="Lernzyklus in vier Phasen um eine Uhr: 1. Inputphase (5 bis 15 min): klar strukturierte, visuell unterstützte Wissensvermittlung ohne Überfrachtung des Arbeitsgedächtnisses. 2. Planung (3 min): verbindliche Festlegung eines überprüfbaren Vorhabens für die Stunde. 3. Durchführung: aktive Lernzeit an Lernplänen, in der die Lehrkraft coacht statt nur zu kontrollieren. 4. Reflexion (3 min): Vergleich von Soll und Ist sowie Bewertung der genutzten Strategien am Ende jeder Stunde."></figure>' +

  }

  function viewArea() {
    const a = AREAS[state.area];
    const cats = catsOf(state.area).map(function (c) {
      const f = qsOfCat(c.id).filter(function (q) { return favs.has(q.id); }).length;
      return '<button type="button" class="cat" data-action="cat" data-cat="' + c.id + '">' +
        '<h3>' + esc(c.name) + '</h3><p>' + esc(c.desc) + '</p>' +
        '<span class="meta"><span>' + qsOfCat(c.id).length + ' Fragen</span>' + (f ? '<span class="f">' + STAR.replace('fill="none"', 'fill="currentColor"') + f + ' Favorit' + (f === 1 ? "" : "en") + '</span>' : "") + '</span></button>';
    }).join("");
    return '<div class="head"><span class="eyebrow">' + a.label + '</span><h2 class="view-title" tabindex="-1">' + a.title + '</h2><p class="lead">' + a.sub + '. Wähle eine Kategorie.</p></div>' +
      '<div class="cats">' + cats + '</div>';
  }

  function viewCat() {
    const c = CAT_BY_ID[state.cat], a = AREAS[c.area];
    const chips = catsOf(c.area).map(function (o) {
      return '<button type="button" class="chip" data-action="cat" data-cat="' + o.id + '"' + (o.id === c.id ? ' aria-current="true"' : "") + '>' + esc(o.name) + '</button>';

    return '<button type="button" class="back" data-action="area" data-area="' + c.area + '">← Alle Kategorien</button>' +

      return (state.favArea === "all" || q.area === state.favArea) && (state.favCat === "all" || q.cat === state.favCat);
    });
    const areaBtn = function (k, label) { return '<button type="button" class="chip" data-action="favArea" data-val="' + k + '" aria-pressed="' + (state.favArea === k) + '">' + label + '</button>'; };
    const opt = function (c) {
      const n = all.filter(function (q) { return q.cat === c.id; }).length;
      return '<option value="' + c.id + '"' + (state.favCat === c.id ? " selected" : "") + (n ? "" : " disabled") + '>' + esc(c.name) + ' (' + n + ')</option>';
    };
    let options = '<option value="all">Alle Kategorien</option>';
    ["start", "reflexion"].forEach(function (k) {
      if (state.favArea === "all" || state.favArea === k) options += '<optgroup label="' + AREAS[k].label + '">' + catsOf(k).map(opt).join("") + '</optgroup>';
    });
    html += '<div class="toolbar"><div class="field"><span class="lbl" id="favAreaLbl">Bereich</span><div class="chips" role="group" aria-labelledby="favAreaLbl">' +
      areaBtn("all", "Alle") + areaBtn("start", "Planung") + areaBtn("reflexion", "Reflexion") + '</div></div>' +
      '<div class="field"><label for="favCatSel">Kategorie</label><select id="favCatSel">' + options + '</select></div></div>' +
      '<p class="result-info">' + list.length + ' von ' + all.length + ' Favoriten</p>';
    if (!list.length) return html + '<div class="empty"><h3>Keine Favoriten in dieser Auswahl</h3><p>Wähle einen anderen Bereich oder eine andere Kategorie.</p><button type="button" class="btn" data-action="favReset">Filter zurücksetzen</button></div>';
    return html + '<div class="qs">' + list.map(function (q) { return card(q, { showArea: true }); }).join("") + '</div>';
  }

  function catOptions(selected) {
    return ["start", "reflexion"].map(function (k) {
      return '<optgroup label="' + AREAS[k].label + '">' + catsOf(k).map(function (c) {
        return '<option value="' + c.id + '"' + (c.id === selected ? " selected" : "") + '>' + esc(c.name) + '</option>';
      }).join("") + '</optgroup>';
    }).join("");
  }

  function viewOwn() {
    const editing = state.editId && Q_BY_ID[state.editId];
    let html = '<div class="head"><span class="eyebrow">Für deinen Unterricht</span><h2 class="view-title" tabindex="-1">Meine eigenen Fragen</h2>' +
      '<p class="lead">Schreibe eigene Fragen und ordne sie einer Kategorie zu. Sie erscheinen dann auch bei Planung oder Reflexion, in der Suche und bei den Favoriten.</p></div>';
    html += '<form class="own-form' + (editing ? " editing" : "") + '" id="ownForm" novalidate>' +
      '<h3>' + (editing ? "Frage bearbeiten" : "Neue Frage") + '</h3>' +
      '<div class="field full"><label for="ownText">Frage an die Schülerinnen und Schüler</label>' +
      '<textarea id="ownText" rows="3" maxlength="300" placeholder="Zum Beispiel: Welche Strategie willst du heute zum ersten Mal testen?" aria-describedby="ownHint ownErr"></textarea>' +
      '<p class="hint" id="ownHint"><span>Kurz, offen und in der Du-Form formulieren.</span><span id="ownLen">0 / 300</span></p>' +
      '<p class="err" id="ownErr" role="alert"' + (state.ownError ? "" : " hidden") + '>' + esc(state.ownError) + '</p></div>' +
      '<div class="field full"><label for="ownCat">Zeitpunkt und Kategorie</label><select id="ownCat">' + catOptions(state.ownCat) + '</select></div>' +
      '<div class="form-actions"><button type="submit" class="btn">' + (editing ? "Änderung speichern" : "Frage hinzufügen") + '</button>' +
      (editing ? '<button type="button" class="btn-ghost" data-action="ownCancel">Abbrechen</button>' : "") + '</div></form>';
    const mine = QUESTIONS.filter(function (q) { return q.own; });
    if (!mine.length) {
      return html + '<div class="empty">' + PEN + '<h3>Noch keine eigenen Fragen</h3><p>Schreibe oben deine erste Frage. Sie wird nur in diesem Browser gespeichert.</p></div>';
    }
    html += '<p class="result-info">' + mine.length + (mine.length === 1 ? " eigene Frage" : " eigene Fragen") + '</p>';
    return html + '<div class="qs">' + mine.map(function (q) { return card(q, { showArea: true, manage: true }); }).join("") + '</div>';
  }

  function afterOwnRender() {
    const ta = document.getElementById("ownText");
    if (!ta) return;
    ta.value = state.ownDraft;
    document.getElementById("ownLen").textContent = ta.value.length + " / 300";
  }

  function submitOwn() {
    const text = state.ownDraft.trim().replace(/\s+/g, " ");
    const cat = state.ownCat;
    if (!text) { state.ownError = "Bitte gib eine Frage ein."; render(false); document.getElementById("ownText").focus(); return; }
    if (!CAT_BY_ID[cat]) { state.ownError = "Bitte wähle eine Kategorie."; render(false); document.getElementById("ownCat").focus(); return; }
    const dup = QUESTIONS.some(function (q) { return q.id !== state.editId && q.text.toLowerCase() === text.toLowerCase(); });
    if (dup) { state.ownError = "Diese Frage gibt es schon. Formuliere sie anders oder markiere die vorhandene als Favorit."; render(false); document.getElementById("ownText").focus(); return; }
    let msg;
    if (state.editId) {
      const o = own.find(function (x) { return x.id === state.editId; });
      if (o) { o.text = text; o.cat = cat; o.area = CAT_BY_ID[cat].area; }
      msg = "Änderung gespeichert.";
      state.editId = null;
    } else {
      own.push({ id: "E-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), cat: cat, area: CAT_BY_ID[cat].area, text: text });
      msg = "Frage hinzugefügt. Sie erscheint unter " + AREAS[CAT_BY_ID[cat].area].label + ": " + CAT_BY_ID[cat].name + ".";
    }
    const saved = saveOwn();
    rebuild();
    state.ownDraft = ""; state.ownError = "";
    render(false);
    document.getElementById("ownText").focus();
    showToast(saved ? msg : "Die Frage ist nur bis zum Schließen verfügbar, weil dieser Browser nichts dauerhaft speichern kann.");
  }

  function deleteOwn(id) {
    const idx = own.findIndex(function (x) { return x.id === id; });
    if (idx === -1) return;
    const removed = own.splice(idx, 1)[0];
    const wasFav = favs.delete(id);
    if (state.editId === id) { state.editId = null; state.ownDraft = ""; }
    saveOwn(); saveFavs(); rebuild(); refreshKeepScroll();
    showToast("Eigene Frage gelöscht.", "Rückgängig", function () {
      own.splice(Math.min(idx, own.length), 0, removed);
      if (wasFav) favs.add(id);
      saveOwn(); saveFavs(); rebuild(); refreshKeepScroll();
      showToast("Wiederhergestellt.");
    });
  }

  function viewSearch() {
    const q = state.query.trim(), lq = q.toLowerCase();
    const res = QUESTIONS.filter(function (x) { return x.text.toLowerCase().indexOf(lq) !== -1 || CAT_BY_ID[x.cat].name.toLowerCase().indexOf(lq) !== -1; });
    let html = '<div class="head"><span class="eyebrow">Suche</span><h2 class="view-title">Ergebnisse für „' + esc(q) + '“</h2></div>';
    if (!res.length) return html + '<div class="empty"><h3>Keine passende Frage gefunden</h3><p>Versuche einen kürzeren oder anderen Begriff, zum Beispiel „Ziel“, „Hilfe“ oder „Gruppe“.</p><button type="button" class="btn" data-action="clearSearch">Suche leeren</button></div>';
    html += '<p class="result-info" aria-live="polite">' + res.length + (res.length === 1 ? " Frage" : " Fragen") + ' gefunden</p>';
    return html + '<div class="qs">' + res.map(function (x) { return card(x, { showArea: true, query: q }); }).join("") + '</div>';
  }

  function render(focusHeading) {
    let html;
    if (state.query.trim()) html = viewSearch();
    else if (state.view === "area") html = viewArea();
    else if (state.view === "cat") html = viewCat();
    else if (state.view === "fav") html = viewFav();
    else if (state.view === "own") html = viewOwn();
    else html = viewHome();
    app.innerHTML = html;
    afterOwnRender();
    document.querySelectorAll(".tab").forEach(function (t) {
      const active = !state.query.trim() && ((t.dataset.action === "fav" && state.view === "fav") || (t.dataset.action === "own" && state.view === "own") ||
        (t.dataset.area && (state.view === "area" || state.view === "cat") && state.area === t.dataset.area));
      if (active) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current");
    });
    updateCount();
    if (focusHeading) {
      const h = app.querySelector(".view-title");
      if (h) h.focus({ preventScroll: true });
      window.scrollTo(0, 0);
    }
  }
  function updateCount() {
    document.getElementById("favCount").textContent = favs.size;
    document.getElementById("ownCount").textContent = own.length;
  }

  /* ---------- Navigation ---------- */
  function go(view, opts, push) {
    opts = opts || {};
    state.view = view;
    if (opts.area) state.area = opts.area;
    if (opts.cat) { state.cat = opts.cat; state.area = CAT_BY_ID[opts.cat].area; }
    if (state.query) { state.query = ""; qInput.value = ""; qClear.hidden = true; }
    const token = view === "home" ? "" : view === "fav" ? "favoriten" : view === "own" ? "eigene" : view === "cat" ? state.cat : state.area;
    if (push !== false) {
      try { if (location.hash.slice(1) !== token) history.pushState(null, "", token ? "#" + token : location.pathname + location.search); } catch (e) {}
    }
    render(true);
  }
  function fromHash() {
    let h = "";
    try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
    if (h === "favoriten") go("fav", {}, false);
    else if (h === "eigene") go("own", {}, false);
    else if (h === "start" || h === "reflexion") go("area", { area: h }, false);
    else if (CAT_BY_ID[h]) go("cat", { cat: h }, false);
    else go("home", {}, false);
  }
  window.addEventListener("popstate", fromHash);

  /* ---------- Favoriten umschalten ---------- */
  function toggleFav(id, btn) {
    const was = favs.has(id);
    if (was) favs.delete(id); else favs.add(id);
    saveFavs();
    if (state.view === "fav" && !state.query.trim()) {
      render(false);
      const h = app.querySelector(".view-title"); if (h) h.focus({ preventScroll: true });
    } else {
      const art = btn.closest(".q");
      art.classList.toggle("is-fav", !was);
      btn.setAttribute("aria-pressed", String(!was));
      const l = !was ? "Aus Favoriten entfernen" : "Als Favorit markieren";
      btn.setAttribute("aria-label", l); btn.title = l;
      updateCount();
    }
    if (was) showToast("Aus Favoriten entfernt.", "Rückgängig", function () { favs.add(id); saveFavs(); refreshKeepScroll(); showToast("Wiederhergestellt."); });
    else showToast("Als Favorit gespeichert.");
  }
  function refreshKeepScroll() { const y = window.scrollY; render(false); window.scrollTo(0, y); }

  /* ---------- Rückmeldung ---------- */
  const toast = document.getElementById("toast");
  let toastTimer;
  function showToast(msg, actionLabel, actionFn) {
    clearTimeout(toastTimer);
    toast.innerHTML = "<span>" + esc(msg) + "</span>" + (actionLabel ? '<button type="button" id="toastAct">' + esc(actionLabel) + "</button>" : "");
    toast.hidden = false;
    if (actionLabel) document.getElementById("toastAct").onclick = function () { toast.hidden = true; actionFn(); };
    toastTimer = setTimeout(function () { toast.hidden = true; }, actionLabel ? 6000 : 3200);
  }

  /* ---------- Ereignisse ---------- */
  document.addEventListener("click", function (e) {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const act = el.dataset.action;
    if (act === "home") go("home");
    else if (act === "area") go("area", { area: el.dataset.area });
    else if (act === "cat") go("cat", { cat: el.dataset.cat });
    else if (act === "fav") go("fav");
    else if (act === "own") go("own");
    else if (act === "ownEdit") {
      const q = Q_BY_ID[el.closest(".q").dataset.id];
      state.editId = q.id; state.ownDraft = q.text; state.ownCat = q.cat; state.ownError = "";
      render(false); window.scrollTo(0, 0);
      const ta = document.getElementById("ownText"); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
    }
    else if (act === "ownCancel") { state.editId = null; state.ownDraft = ""; state.ownError = ""; render(false); document.getElementById("ownText").focus(); }
    else if (act === "ownDelete") deleteOwn(el.closest(".q").dataset.id);
    else if (act === "star") toggleFav(el.closest(".q").dataset.id, el);
    else if (act === "favArea") { state.favArea = el.dataset.val; render(false); const b = app.querySelector('[data-action="favArea"][data-val="' + state.favArea + '"]'); if (b) b.focus(); }
    else if (act === "favReset") { state.favArea = "all"; state.favCat = "all"; render(true); }
    else if (act === "clearSearch") { qInput.value = ""; state.query = ""; qClear.hidden = true; render(false); qInput.focus(); }
  });
  app.addEventListener("submit", function (e) {
    if (e.target.id === "ownForm") { e.preventDefault(); submitOwn(); }
  });
  app.addEventListener("input", function (e) {
    if (e.target.id === "ownText") {
      state.ownDraft = e.target.value;
      document.getElementById("ownLen").textContent = e.target.value.length + " / 300";
      if (state.ownError) { state.ownError = ""; document.getElementById("ownErr").hidden = true; }
    }
  });
  app.addEventListener("keydown", function (e) {
    if (e.target.id === "ownText" && e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submitOwn(); }
  });
  app.addEventListener("change", function (e) {
    if (e.target.id === "ownCat") { state.ownCat = e.target.value; return; }
    if (e.target.id === "favCatSel") { state.favCat = e.target.value; render(false); const s = document.getElementById("favCatSel"); if (s) s.focus(); }
  });
  qInput.addEventListener("input", function () {
    state.query = qInput.value;
    qClear.hidden = !qInput.value;
    render(false);
  });
  qInput.addEventListener("keydown", function (e) { if (e.key === "Escape" && qInput.value) { e.preventDefault(); qClear.click(); } });
  qClear.addEventListener("click", function () { qInput.value = ""; state.query = ""; qClear.hidden = true; render(false); qInput.focus(); });

  fromHash();
})();
</script>
</body>
</html>

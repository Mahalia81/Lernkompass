<style>
/* Layout: weiße Kopfzeile mit dunkelblauem Streifen wie in den GMSCC-Folien, darunter Kacheln, Lernzyklus und Fragekarten */
:root {
  --bg: #f3f8fd;
  --surface: #ffffff;
  --ink: #0A3254;
  --muted: #46607c;
  --line: #cfe2f3;
  --field-border: #6b829b;
  --bar: #0A3254;
  --navy: #0A3254;
  --blue: #0E497C;
  --blue-soft: #e4f2fd;
  --teal: #3C70AB;
  --accent: #2B92D5;
  --star: #a06c00;
  --star-ink: #8a5d00;
  --star-soft: #fff4d6;
  --focus: #2B92D5;
  --mark: #BEE0FA;
  --font-display: Helvetica, Arial, sans-serif;
  --font-body: Helvetica, Arial, sans-serif;
  --radius: 10px;
  /* Phasenfarben wie in der Lernzyklus-Grafik: Akzent für Linien, -ink für Text, -soft für Flächen */
  --c-start: #2B92D5; --c-start-ink: #1D6FA8; --c-start-soft: #e4f2fd;
  --c-durch: #3C70AB; --c-durch-ink: #2F5E93; --c-durch-soft: #e2ebf6;
  --c-refl: #0A3254; --c-refl-ink: #0A3254; --c-refl-soft: #dde5ee;
  --on-phase: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #061a2e; --surface: #0b2742; --ink: #e8f2fc; --muted: #a8c0d9; --line: #1d4266; --field-border: #5f86ad; --bar: #2B92D5;
    --navy: #0A3254; --blue: #8cc6f2; --blue-soft: #123a5f; --teal: #a7c4e8; --accent: #2B92D5;
    --star: #f2b632; --star-ink: #f2b632; --star-soft: rgba(242, 182, 50, 0.15); --focus: #8cc6f2; --mark: #1f4f7c;
    --c-start: #8cc6f2; --c-start-ink: #8cc6f2; --c-start-soft: #123a5f;
    --c-durch: #9dbbe3; --c-durch-ink: #9dbbe3; --c-durch-soft: #173d63;
    --c-refl: #d3e0ef; --c-refl-ink: #d3e0ef; --c-refl-soft: #1d3a5c; --on-phase: #061a2e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #061a2e; --surface: #0b2742; --ink: #e8f2fc; --muted: #a8c0d9; --line: #1d4266; --field-border: #5f86ad; --bar: #2B92D5;
  --navy: #0A3254; --blue: #8cc6f2; --blue-soft: #123a5f; --teal: #a7c4e8; --accent: #2B92D5;
  --star: #f2b632; --star-ink: #f2b632; --star-soft: rgba(242, 182, 50, 0.15); --focus: #8cc6f2; --mark: #1f4f7c;
  --c-start: #8cc6f2; --c-start-ink: #8cc6f2; --c-start-soft: #123a5f;
  --c-durch: #9dbbe3; --c-durch-ink: #9dbbe3; --c-durch-soft: #173d63;
  --c-refl: #d3e0ef; --c-refl-ink: #d3e0ef; --c-refl-soft: #1d3a5c; --on-phase: #061a2e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.5; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 12px; top: -100px; z-index: 30; background: var(--surface); color: var(--ink); padding: 10px 14px; border-radius: 8px; font-weight: 700; }
.skip:focus { top: 12px; }

/* Kopfzeile */
.top { background: var(--surface); color: var(--ink); border-top: 10px solid var(--bar); border-bottom: 1px solid var(--line); }
.top .wrap { display: grid; grid-template-columns: auto 1fr; grid-template-areas: "brand search" "tabs tabs"; align-items: center; gap: 8px 24px; padding-block: 12px 0; }
.brand { grid-area: brand; display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 4px; margin-left: -4px; cursor: pointer; text-align: left; color: var(--ink); border-radius: 8px; }
.brand svg { width: 40px; height: 40px; flex: none; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; line-height: 1.1; display: block; }
.brand-claim { font-size: 0.85rem; color: var(--muted); display: block; }
nav.tabs { grid-area: tabs; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; padding-inline: 4px; }
nav.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; background: transparent; border: 0; color: var(--muted); padding: 10px 14px 12px; border-radius: 8px 8px 0 0; cursor: pointer; font-weight: 700; font-size: 0.95rem; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.tab:hover { color: var(--ink); background: var(--blue-soft); }
.tab[aria-current="page"] { color: var(--ink); background: var(--blue-soft); box-shadow: inset 0 -3px 0 var(--blue); }
.tab-sep { flex: none; width: 1px; margin: 10px 6px; background: var(--line); }
.count { font-variant-numeric: tabular-nums; font-size: 0.8rem; min-width: 1.6em; padding: 1px 7px; border-radius: 99px; background: var(--line); color: var(--ink); text-align: center; }
.count:empty { display: none; }
.search { grid-area: search; justify-self: end; position: relative; width: 340px; max-width: 100%; }
.search input { width: 100%; padding: 10px 38px; border-radius: 8px; border: 1px solid var(--field-border); background: var(--surface); color: var(--ink); }
.search input::placeholder { color: var(--muted); }
.search input:focus { border-color: var(--accent); }
.search .ico { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search .clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); background: none; border: 0; color: var(--muted); width: 32px; height: 32px; border-radius: 6px; cursor: pointer; font-size: 1.2rem; line-height: 1; }
.search .clear:hover { color: var(--ink); }
@media (max-width: 640px) {
  .top .wrap { grid-template-columns: minmax(0, 1fr); grid-template-areas: "brand" "search" "tabs"; }
  .search { width: 100%; }
  nav.tabs { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); padding-right: 28px; }
  .tab { padding-inline: 10px; font-size: 0.9rem; gap: 6px; }
}

main { padding-block: 32px 64px; }
main:focus { outline: none; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; color: var(--ink); text-wrap: balance; margin: 0; }
.view-title { font-size: clamp(1.5rem, 3.5vw, 2rem); line-height: 1.2; }
.view-title:focus { outline: none; }
.eyebrow { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; color: var(--teal); }
.lead { color: var(--muted); max-width: 62ch; margin: 6px 0 0; }
.head { display: grid; gap: 4px; margin-bottom: 24px; }

/* Startseite */
.hero-line { margin-bottom: 24px; }
.hero-line h1 { font-size: clamp(1.6rem, 4vw, 2.3rem); }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
@media (max-width: 900px) { .tiles { grid-template-columns: 1fr; } }
/* Phasenfarbe einmal je Element setzen, Kacheln, Pills und Karten lesen sie */
.tile.start, .pill.start, .q.a-start, .fav-group.start, .dot-ph.start { --tc: var(--c-start); --tc-ink: var(--c-start-ink); --tc-soft: var(--c-start-soft); }
.tile.durchfuehrung, .pill.durchfuehrung, .q.a-durchfuehrung, .fav-group.durchfuehrung, .dot-ph.durchfuehrung { --tc: var(--c-durch); --tc-ink: var(--c-durch-ink); --tc-soft: var(--c-durch-soft); }
.tile.reflexion, .pill.reflexion, .q.a-reflexion, .fav-group.reflexion, .dot-ph.reflexion { --tc: var(--c-refl); --tc-ink: var(--c-refl-ink); --tc-soft: var(--c-refl-soft); }
.tile { display: grid; gap: 14px; align-content: start; text-align: left; padding: 30px 24px 24px; border-radius: 14px; border: 1px solid var(--line); box-shadow: inset 0 6px 0 var(--tc); background: var(--surface); cursor: pointer; transition: border-color .15s, transform .15s; position: relative; }
.tile:hover { border-color: var(--tc); transform: translateY(-2px); }
.tile .phase { display: flex; align-items: center; gap: 10px; }
.tile .dot { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--tc-soft); color: var(--tc-ink); }
.tile .dot svg { width: 24px; height: 24px; }
.tile .eyebrow { color: var(--tc-ink); }
.tile h2 { font-size: clamp(1.25rem, 2.2vw, 1.45rem); line-height: 1.2; }
.tile p { margin: 0; color: var(--muted); }
.tile .meta { font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tile .go { font-weight: 700; color: var(--tc-ink); }
.favbar { margin-top: 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 18px 24px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); width: 100%; cursor: pointer; text-align: left; }
.favbar:hover { border-color: var(--blue); }
.favbar strong { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }

.qs { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }

      ? '<div class="q-actions"><button type="button" class="act" data-action="ownEdit" aria-describedby="' + esc(tid) + '">Bearbeiten</button><button type="button" class="act danger" data-action="ownDelete" aria-describedby="' + esc(tid) + '">Löschen</button></div>'
      : "";
    return '<article class="q a-' + q.area + (state.editId === q.id && opts.manage ? " is-editing" : "") + '" data-id="' + esc(q.id) + '">' +
      (meta ? '<div class="q-meta">' + meta + '</div>' : "") +
      '<p class="q-text' + (meta ? "" : " no-meta") + '" id="' + esc(tid) + '">' + highlight(q.text, opts.query) + '</p>' + actions +
      '<button type="button" class="star" data-action="star" aria-pressed="' + fav + '" aria-label="Als Favorit merken" aria-describedby="' + esc(tid) + '" title="Als Favorit merken">' + STAR + '</button>' +
      '</article>';
  }

  /* ---------- Ansichten ---------- */
  function viewHome() {
    function tile(area) {
      const a = AREAS[area], cs = catsOf(area);
      const n = cs.reduce(function (s, c) { return s + qsOfCat(c.id).length; }, 0);

        '<span class="phase"><span class="dot">' + ICONS[area] + '</span><span class="eyebrow">' + a.phase + '</span></span>' +
        '<h2>' + a.title + '</h2><p>' + a.sub + '</p>' +
        '<span class="meta">' + cs.length + ' Kategorien · ' + n + ' Fragen</span>' +

    return '<div class="hero-line head"><h1 class="view-title" tabindex="-1">Die richtige Frage zur richtigen Zeit.</h1>' +
      '<p class="lead">Wähle den Zeitpunkt der Lernphase. Danach findest du passende Fragen für deine Schülerinnen und Schüler.</p></div>' +
      '<div class="tiles">' + AREA_ORDER.map(tile).join("") + '</div>' +
      '<div class="bars"><button type="button" class="favbar" data-action="fav"><strong>' + STAR.replace('fill="none"', 'fill="currentColor"') + 'Favoriten</strong><span>' +
      (fc ? fc + (fc === 1 ? " Frage gespeichert" : " Fragen gespeichert") : "Noch keine Fragen gespeichert") + '</span></button>' +
      '<button type="button" class="favbar ownbar" data-action="own"><strong>' + PEN + 'Eigene Fragen</strong><span>' +
      (own.length ? own.length + (own.length === 1 ? " eigene Frage" : " eigene Fragen") : "Eigene Frage hinzufügen") + '</span></button></div>' +
      '<section class="cycle" aria-labelledby="cycleTitle"><div class="head"><span class="eyebrow">Unser Lernzyklus</span><h2 id="cycleTitle">Die Umsetzung am Campus Cordis</h2>' +
      '<p class="lead">Die Fragen gehören zu Phase 2 (Planung, 3&nbsp;min), Phase 3 (Durchführung) und Phase 4 (Reflexion, 3&nbsp;min).</p></div>' +
      '<figure id="cycleFig"></figure>' +
      '<ol class="cycle-list">' +
      '<li><strong>Inputphase (5–15 min):</strong> klar strukturierte, visuell unterstützte Wissensvermittlung ohne Überfrachtung des Arbeitsgedächtnisses</li>' +
      '<li><strong>Planung (3 min):</strong> verbindliche Festlegung eines überprüfbaren Vorhabens für die Stunde</li>' +
      '<li><strong>Durchführung:</strong> aktive Lernzeit an Lernplänen, in der die Lehrkraft coacht, statt nur zu kontrollieren</li>' +
      '<li><strong>Reflexion (3 min):</strong> Vergleich von Soll und Ist sowie Bewertung der genutzten Strategien am Ende jeder Stunde</li></ol>' +
      '<div class="cycle-links">' + AREA_ORDER.map(function (k) { return '<button type="button" class="btn-ghost" data-action="area" data-area="' + k + '">Fragen für ' + AREAS[k].phase.replace(" · ", ": ") + '</button>'; }).join("") + '</div></section>';
  }
  function afterHomeRender() {
    const fig = document.getElementById("cycleFig");
    if (!fig) return;
    if (!cycleImg) {
      cycleImg = new Image();
      cycleImg.width = 1400; cycleImg.height = 623; cycleImg.decoding = "async";
      cycleImg.alt = ZYKLUS_ALT; cycleImg.src = ZYKLUS;
    }
    fig.appendChild(cycleImg);
  }

  function viewArea() {
    const a = AREAS[state.area];
    const cats = catsOf(state.area).map(function (c) {
      const f = qsOfCat(c.id).filter(function (q) { return favs.has(q.id); }).length;
      return '<button type="button" class="cat" data-action="cat" data-cat="' + c.id + '">' +
        '<h2>' + esc(c.name) + '</h2><p>' + esc(c.desc) + '</p>' +
        '<span class="meta"><span>' + qsOfCat(c.id).length + ' Fragen</span>' + (f ? '<span class="f">' + STAR.replace('fill="none"', 'fill="currentColor"') + f + ' Favorit' + (f === 1 ? "" : "en") + '</span>' : "") + '</span></button>';
    }).join("");
    return '<div class="head"><span class="eyebrow">' + a.phase + '</span><h1 class="view-title" tabindex="-1">' + a.title + '</h1><p class="lead">' + a.sub + '. Wähle eine Kategorie.</p></div>' +
      '<div class="cats">' + cats + '</div>';
  }

  function viewCat() {
    const c = CAT_BY_ID[state.cat], a = AREAS[c.area];
    const chips = catsOf(c.area).map(function (o) {
      return '<button type="button" class="chip" data-action="cat" data-cat="' + o.id + '"' + (o.id === c.id ? ' aria-current="true"' : "") + '>' + esc(o.name) + '</button>';
    }).join("");
    const list = qsOfCat(c.id).slice().sort(function (x, y) { return (y.impuls ? 1 : 0) - (x.impuls ? 1 : 0) || x.order - y.order; });
    return '<button type="button" class="back" data-action="area" data-area="' + c.area + '">← Alle Kategorien</button>' +
      '<div class="head"><span class="eyebrow">' + a.phase + '</span><h1 class="view-title" tabindex="-1">' + esc(c.name) + '</h1><p class="lead">' + esc(c.desc) + '</p></div>' +
      '<div class="chips-scroll" aria-label="Kategorie wechseln" role="group"><div class="chips">' + chips + '</div></div>' +
      '<div class="qs">' + list.map(function (q) { return card(q, { hideCat: true }); }).join("") + '</div>';
  }

  function viewFav() {
    const all = QUESTIONS.filter(function (q) { return favs.has(q.id); });
    let html = '<div class="head"><span class="eyebrow">Gesammelt</span><h1 class="view-title" tabindex="-1">Favoriten</h1></div>';
    if (!all.length) {
      return html + '<div class="empty">' + STAR + '<h2>Noch keine Favoriten</h2><p>Markiere eine Frage mit dem Stern. Sie erscheint dann hier und bleibt in diesem Browser gespeichert.</p>' +
        '<button type="button" class="btn" data-action="home">Fragen entdecken</button></div>';
    }
    const countIn = function (catId) { return all.filter(function (q) { return q.cat === catId; }).length; };
    // Ungültige oder inzwischen leere Kategorie nicht ausgewählt lassen
    if (state.favCat !== "all" && (!CAT_BY_ID[state.favCat] || !countIn(state.favCat) || (state.favArea !== "all" && CAT_BY_ID[state.favCat].area !== state.favArea))) state.favCat = "all";
    const list = all.filter(function (q) {
      return (state.favArea === "all" || q.area === state.favArea) && (state.favCat === "all" || q.cat === state.favCat);
    });
    const areaBtn = function (k, label) { return '<button type="button" class="chip" data-action="favArea" data-val="' + k + '" aria-pressed="' + (state.favArea === k) + '">' + label + '</button>'; };
    const opt = function (c) {
      const n = countIn(c.id);
      return '<option value="' + c.id + '"' + (state.favCat === c.id ? " selected" : "") + (n ? "" : " disabled") + '>' + AREAS[c.area].label + ' · ' + esc(c.name) + ' (' + n + ')</option>';
    };
    let options = '<option value="all">Alle Kategorien</option>';
    AREA_ORDER.forEach(function (k) {
      if (state.favArea === "all" || state.favArea === k) options += '<optgroup label="' + AREAS[k].label + '">' + catsOf(k).map(opt).join("") + '</optgroup>';
    });
    html += '<div class="toolbar"><div class="field"><span class="lbl" id="favAreaLbl">Bereich</span><div class="chips" role="group" aria-labelledby="favAreaLbl">' +
      areaBtn("all", "Alle") + AREA_ORDER.map(function (k) { return areaBtn(k, '<span class="dot-ph ' + k + '" aria-hidden="true"></span>' + AREAS[k].label); }).join("") + '</div></div>' +
      '<div class="field"><label for="favCatSel">Kategorie</label><select id="favCatSel">' + options + '</select></div></div>' +
      '<p class="result-info">' + list.length + ' von ' + all.length + ' Favoriten</p>';
    if (!list.length) return html + '<div class="empty"><h2>Keine Favoriten in dieser Auswahl</h2><p>Wähle einen anderen Bereich oder eine andere Kategorie.</p><button type="button" class="btn" data-action="favReset">Filter zurücksetzen</button></div>';
    return html + AREA_ORDER.map(function (k) {
      const part = list.filter(function (q) { return q.area === k; });
      if (!part.length) return "";
      return '<section class="fav-group ' + k + '" aria-label="' + AREAS[k].phase + '"><h2>' + AREAS[k].phase + ' <span class="n">(' + part.length + ')</span></h2>' +
        '<div class="qs">' + part.map(function (q) { return card(q, { showArea: true }); }).join("") + '</div></section>';
    }).join("");
  }

  function catOptions(selected) {
    return AREA_ORDER.map(function (k) {
      return '<optgroup label="' + AREAS[k].label + '">' + catsOf(k).map(function (c) {
        return '<option value="' + c.id + '"' + (c.id === selected ? " selected" : "") + '>' + AREAS[k].label + ' · ' + esc(c.name) + '</option>';
      }).join("") + '</optgroup>';
    }).join("");
  }

  function viewOwn() {
    const editing = state.editId && Q_BY_ID[state.editId];
    let html = '<div class="head"><span class="eyebrow">Für deinen Unterricht</span><h1 class="view-title" tabindex="-1">Eigene Fragen</h1>' +
      '<p class="lead">Schreibe eigene Fragen und ordne sie einer Kategorie zu. Sie erscheinen dann auch bei Planung, Durchführung oder Reflexion, in der Suche und bei den Favoriten.</p></div>';
    html += '<form class="own-form' + (editing ? " editing" : "") + '" id="ownForm" novalidate>' +
      '<h2>' + (editing ? "Frage bearbeiten" : "Neue Frage") + '</h2>' +
      '<div class="field full"><label for="ownText">Frage an die Schülerinnen und Schüler</label>' +
      '<textarea id="ownText" rows="3" maxlength="300" placeholder="Zum Beispiel: Welche Lernstrategie willst du heute zum ersten Mal ausprobieren?" aria-describedby="ownHint ownErr"' + (state.ownError ? ' aria-invalid="true"' : "") + '></textarea>' +
      '<p class="hint" id="ownHint"><span>Kurz, offen und in der Du-Form formulieren.</span><span id="ownLen">0 / 300</span></p>' +
      '<p class="err" id="ownErr" role="alert"' + (state.ownError ? "" : " hidden") + '>' + esc(state.ownError) + '</p></div>' +
      '<div class="field full"><label for="ownCat">Zeitpunkt und Kategorie</label><select id="ownCat">' + catOptions(state.ownCat) + '</select></div>' +
      '<div class="form-actions"><button type="submit" class="btn">' + (editing ? "Änderung speichern" : "Frage hinzufügen") + '</button>' +
      (editing ? '<button type="button" class="btn-ghost" data-action="ownCancel">Abbrechen</button>' : "") + '</div></form>';
    const mine = QUESTIONS.filter(function (q) { return q.own; });
    if (!mine.length) {
      return html + '<div class="empty">' + PEN + '<h2>Noch keine eigenen Fragen</h2><p>Schreibe oben deine erste Frage. Sie wird nur in diesem Browser gespeichert.</p></div>';
    }
    html += '<p class="result-info">' + mine.length + (mine.length === 1 ? " eigene Frage" : " eigene Fragen") + '</p>';
    return html + '<div class="qs">' + mine.map(function (q) { return card(q, { showArea: true, manage: true }); }).join("") + '</div>';
  }

  function afterOwnRender() {
    const ta = document.getElementById("ownText");
    if (!ta) return;
    ta.value = state.ownDraft;
    document.getElementById("ownLen").textContent = ta.value.length + " / 300";
  }

  function submitOwn() {
    const text = normText(state.ownDraft);
    const cat = state.ownCat;
    if (!text) { state.ownError = "Bitte gib eine Frage ein."; render(false); document.getElementById("ownText").focus(); return; }
    if (!CAT_BY_ID[cat]) { state.ownError = "Bitte wähle eine Kategorie."; render(false); document.getElementById("ownCat").focus(); return; }
    const dup = QUESTIONS.some(function (q) { return q.id !== state.editId && q.text.toLowerCase() === text.toLowerCase(); });
    if (dup) { state.ownError = "Diese Frage gibt es schon. Formuliere sie anders oder markiere die vorhandene als Favorit."; render(false); document.getElementById("ownText").focus(); return; }
    let msg;
    const o = state.editId && own.find(function (x) { return x.id === state.editId; });
    if (o) {
      o.text = text; o.cat = cat; o.area = CAT_BY_ID[cat].area;
      msg = "Änderung gespeichert.";
    } else {
      own.push({ id: "E-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), cat: cat, area: CAT_BY_ID[cat].area, text: text });
      // Wurde die bearbeitete Frage inzwischen (z. B. in einem anderen Tab) gelöscht, wird sie neu angelegt statt verworfen
      msg = state.editId ? "Die Frage war inzwischen gelöscht und wurde neu angelegt." : "Frage hinzugefügt. Sie erscheint unter " + AREAS[CAT_BY_ID[cat].area].label + ": " + CAT_BY_ID[cat].name + ".";
    }
    state.editId = null;
    const saved = saveOwn();
    rebuild();
    state.ownDraft = ""; state.ownError = "";
    render(false);
    document.getElementById("ownText").focus();
    showToast(saved ? msg : NOT_SAVED);
  }

  // Nach dem Neuzeichnen die Karte an Position idx (sonst die letzte, sonst die Überschrift) fokussieren
  function focusCardAt(idx, selector) {
    const cards = app.querySelectorAll(".q");
    const target = cards.length ? cards[Math.min(idx, cards.length - 1)].querySelector(selector) : null;
    const el = target || app.querySelector(".view-title");
    if (el) el.focus({ preventScroll: !!target });
  }
  function cardIndex(id) {
    return Array.prototype.findIndex.call(app.querySelectorAll(".q"), function (a) { return a.dataset.id === id; });
  }

  function deleteOwn(id) {
    const idx = own.findIndex(function (x) { return x.id === id; });
    if (idx === -1) return;
    const pos = Math.max(0, cardIndex(id));
    const removed = own.splice(idx, 1)[0];
    const wasFav = favs.delete(id);
    if (state.editId === id) { state.editId = null; state.ownDraft = ""; }
    const okOwn = saveOwn(), okFav = saveFavs(), ok = okOwn && okFav;
    rebuild(); refreshKeepScroll();
    focusCardAt(pos, ".act");
    showToast(ok ? "Eigene Frage gelöscht." : NOT_SAVED, "Rückgängig", function () {
      own.splice(Math.min(idx, own.length), 0, removed);
      if (wasFav) favs.add(id);
      const okOwn2 = saveOwn(), okFav2 = saveFavs(), ok2 = okOwn2 && okFav2;
      rebuild(); refreshKeepScroll();
      const back = app.querySelector('.q[data-id="' + id + '"] .act');
      if (back) back.focus(); else focusCardAt(0, ".act");
      showToast(ok2 ? "Wiederhergestellt." : NOT_SAVED);
    });
  }

  function viewSearch() {
    const q = state.query.trim(), lq = q.toLowerCase();
    const res = QUESTIONS.filter(function (x) { return x.text.toLowerCase().indexOf(lq) !== -1 || CAT_BY_ID[x.cat].name.toLowerCase().indexOf(lq) !== -1; });
    let html = '<div class="head"><span class="eyebrow">Suche</span><h1 class="view-title" tabindex="-1">Ergebnisse für „' + esc(q) + '“</h1></div>';
    announce(res.length ? res.length + (res.length === 1 ? " Frage" : " Fragen") + " gefunden" : "Keine passende Frage gefunden", 500);
    if (!res.length) return html + '<div class="empty"><h2>Keine passende Frage gefunden</h2><p>Versuche einen kürzeren oder anderen Begriff, zum Beispiel „Ziel“, „Hilfe“ oder „Gruppe“.</p><button type="button" class="btn" data-action="clearSearch">Suche leeren</button></div>';
    html += '<p class="result-info">' + res.length + (res.length === 1 ? " Frage" : " Fragen") + ' gefunden</p>';
    return html + '<div class="qs">' + res.map(function (x) { return card(x, { showArea: true, query: q }); }).join("") + '</div>';
  }

  function render(focusHeading) {
    let html;
    if (state.query.trim()) html = viewSearch();
    else if (state.view === "area") html = viewArea();
    else if (state.view === "cat") html = viewCat();
    else if (state.view === "fav") html = viewFav();
    else if (state.view === "own") html = viewOwn();
    else html = viewHome();
    app.innerHTML = html;
    afterOwnRender();
    afterHomeRender();
    document.querySelectorAll(".tab").forEach(function (t) {
      const active = !state.query.trim() && ((t.dataset.action === "fav" && state.view === "fav") || (t.dataset.action === "own" && state.view === "own") ||
        (t.dataset.area && (state.view === "area" || state.view === "cat") && state.area === t.dataset.area));
      if (active) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current");
    });
    updateCount();
    const h = app.querySelector(".view-title");
    document.title = (state.query.trim() || state.view !== "home") && h ? h.textContent + " – LernKompass" : "LernKompass";
    if (focusHeading) {
      if (h) h.focus({ preventScroll: true });
      window.scrollTo(0, 0);
    }
  }
  function updateCount() {
    document.getElementById("favCount").textContent = favs.size || "";
    document.getElementById("ownCount").textContent = own.length || "";
  }

  /* ---------- Navigation ---------- */
  let searchTimer;
  function go(view, opts, push) {
    opts = opts || {};
    state.view = view;
    if (opts.area) state.area = opts.area;
    if (opts.cat) { state.cat = opts.cat; state.area = CAT_BY_ID[opts.cat].area; }
    clearTimeout(searchTimer);
    if (state.query || qInput.value) { state.query = ""; qInput.value = ""; qClear.hidden = true; }
    const token = view === "home" ? "" : view === "fav" ? "favoriten" : view === "own" ? "eigene" : view === "cat" ? state.cat : state.area;
    if (push !== false) {
      try { if (location.hash.slice(1) !== token) history.pushState(null, "", token ? "#" + token : location.pathname + location.search); } catch (e) {}
    }
    render(true);
  }
  function fromHash() {
    let h = "";
    try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
    if (h === "favoriten") go("fav", {}, false);
    else if (h === "eigene") go("own", {}, false);
    else if (isArea(h)) go("area", { area: h }, false);
    else if (CAT_BY_ID[h]) go("cat", { cat: h }, false);
    else go("home", {}, false);
  }
  window.addEventListener("popstate", fromHash);

  /* ---------- Favoriten umschalten ---------- */
  function toggleFav(id, btn) {
    const was = favs.has(id);
    if (was) favs.delete(id); else favs.add(id);
    const ok = saveFavs();
    if (state.view === "fav" && !state.query.trim()) {
      // In der Favoritenliste verschwindet die Karte: Fokus auf den Stern der nächsten Karte
      const pos = Math.max(0, cardIndex(id));
      render(false);
      focusCardAt(pos, ".star");
    } else {
      btn.setAttribute("aria-pressed", String(!was));
      updateCount();
    }
    if (!ok) showToast(NOT_SAVED);
    else if (was) showToast("Aus Favoriten entfernt.", "Rückgängig", function () {
      favs.add(id);
      const ok2 = saveFavs();
      refreshKeepScroll();
      const back = app.querySelector('.q[data-id="' + id + '"] .star');
      if (back) back.focus();
      showToast(ok2 ? "Wiederhergestellt." : NOT_SAVED);
    });
    else showToast("Als Favorit gespeichert.");
  }
  function refreshKeepScroll() { const y = window.scrollY; render(false); window.scrollTo(0, y); }

  /* ---------- Rückmeldung ---------- */
  const toast = document.getElementById("toast");
  let toastTimer, toastMs = 0;
  function hideToast() {
    clearTimeout(toastTimer);
    if (toast.contains(document.activeElement)) { const h = app.querySelector(".view-title"); if (h) h.focus({ preventScroll: true }); }
    toast.hidden = true;
  }
  function startToastTimer() { clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, toastMs); }
  function showToast(msg, actionLabel, actionFn) {
    toast.innerHTML = "<span>" + esc(msg) + "</span>" + (actionLabel ? '<button type="button" id="toastAct">' + esc(actionLabel) + "</button>" : "");
    toast.hidden = false;
    announce(msg);
    if (actionLabel) document.getElementById("toastAct").onclick = function () { hideToast(); actionFn(); };
    // Mit Aktion länger sichtbar; solange Maus oder Fokus im Hinweis sind, läuft die Zeit nicht ab
    toastMs = actionLabel ? 10000 : 3500;
    startToastTimer();
  }
  toast.addEventListener("mouseenter", function () { clearTimeout(toastTimer); });
  toast.addEventListener("focusin", function () { clearTimeout(toastTimer); });
  toast.addEventListener("mouseleave", function () { if (!toast.hidden && !toast.contains(document.activeElement)) startToastTimer(); });
  toast.addEventListener("focusout", function (e) { if (!toast.hidden && !toast.contains(e.relatedTarget)) startToastTimer(); });
  toast.addEventListener("keydown", function (e) { if (e.key === "Escape") hideToast(); });

  /* ---------- Ereignisse ---------- */
  document.addEventListener("click", function (e) {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const act = el.dataset.action;
    if (act === "home") go("home");
    else if (act === "area") go("area", { area: el.dataset.area });
    else if (act === "cat") go("cat", { cat: el.dataset.cat });
    else if (act === "fav") go("fav");
    else if (act === "own") go("own");
    else if (act === "ownEdit") {
      const q = Q_BY_ID[el.closest(".q").dataset.id];
      if (!q) return;
      // Einen angefangenen Entwurf nicht kommentarlos überschreiben
      const prev = { draft: state.ownDraft, editId: state.editId, cat: state.ownCat };
      const lost = normText(prev.draft) && prev.draft !== (Q_BY_ID[prev.editId] || {}).text && prev.draft !== q.text;
      state.editId = q.id; state.ownDraft = q.text; state.ownCat = q.cat; state.ownError = "";
      render(false); window.scrollTo(0, 0);
      const ta = document.getElementById("ownText"); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
      if (lost) showToast("Dein angefangener Text wurde ersetzt.", "Zurückholen", function () {
        state.editId = Q_BY_ID[prev.editId] ? prev.editId : null; state.ownDraft = prev.draft; state.ownCat = prev.cat;
        render(false); document.getElementById("ownText").focus();
      });
    }
    else if (act === "ownCancel") { state.editId = null; state.ownDraft = ""; state.ownError = ""; render(false); document.getElementById("ownText").focus(); }
    else if (act === "ownDelete") deleteOwn(el.closest(".q").dataset.id);
    else if (act === "star") toggleFav(el.closest(".q").dataset.id, el);
    else if (act === "favArea") { state.favArea = el.dataset.val; render(false); const b = app.querySelector('[data-action="favArea"][data-val="' + state.favArea + '"]'); if (b) b.focus(); }
    else if (act === "favReset") { state.favArea = "all"; state.favCat = "all"; render(true); }
    else if (act === "clearSearch") { clearSearch(); }
  });
  app.addEventListener("submit", function (e) {
    if (e.target.id === "ownForm") { e.preventDefault(); submitOwn(); }
  });
  app.addEventListener("input", function (e) {
    if (e.target.id === "ownText") {
      state.ownDraft = e.target.value;
      document.getElementById("ownLen").textContent = e.target.value.length + " / 300";
      if (state.ownError) { state.ownError = ""; document.getElementById("ownErr").hidden = true; e.target.removeAttribute("aria-invalid"); }
    }
  });
  app.addEventListener("keydown", function (e) {
    if (e.target.id === "ownText" && e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submitOwn(); }
  });
  app.addEventListener("change", function (e) {
    if (e.target.id === "ownCat") { state.ownCat = e.target.value; return; }
    if (e.target.id === "favCatSel") { state.favCat = e.target.value; render(false); const s = document.getElementById("favCatSel"); if (s) s.focus(); }
  });
  function clearSearch() {
    clearTimeout(searchTimer);
    qInput.value = ""; state.query = ""; qClear.hidden = true;
    const y = searchFrom; searchFrom = null;
    render(false); qInput.focus();
    if (y != null) window.scrollTo(0, y);
  }
  let searchFrom = null;   // Scrollposition vor Beginn der Suche, wird beim Leeren wiederhergestellt
  qInput.addEventListener("input", function () {
    qClear.hidden = !qInput.value;
    if (searchFrom == null && !state.query) searchFrom = window.scrollY;
    // Erst nach einer kurzen Tipp-Pause neu zeichnen
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      state.query = qInput.value;
      if (!state.query.trim()) { clearSearch(); return; }
      render(false);
    }, 150);
  });
  qInput.addEventListener("keydown", function (e) { if (e.key === "Escape" && qInput.value) { e.preventDefault(); clearSearch(); } });
  qClear.addEventListener("click", clearSearch);

  // Änderungen aus anderen Tabs übernehmen, damit sich Tabs nicht gegenseitig Daten überschreiben
  window.addEventListener("storage", function (e) {
    if (e.key !== null && e.key !== OWN_KEY && e.key !== STORE_KEY) return;
    loadOwn(); rebuild(); loadFavs();
    if (document.activeElement && document.activeElement.id === "ownText") updateCount();
    else refreshKeepScroll();
  });

  fromHash();
  if (!storageOk || !ownStorageOk) showToast("Dieser Browser kann Favoriten und eigene Fragen nicht dauerhaft speichern. Sie bleiben nur bis zum Schließen erhalten.");
})();
</script>
